version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: placeandplay-bot
    restart: unless-stopped
    env_file:
      - config.env
    volumes:
      - ./logs:/app/logs
    networks:
      - bot-network

  telegram-notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification
    container_name: placeandplay-telegram-notification-service
    restart: unless-stopped
    env_file:
      - config.env
    ports:
      - "5000:5000"
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bot-network:
    driver: bridge

